<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nuzlocke Verifier</title>
</head>
<body>
  <h1>Nuzlocke Verifier</h1>
  <form id="battle-form">
    <div style="margin: 24px 0;">
      <label for="player">Player party (Showdown file)</label><br>
      <input type="file" id="player" name="player" accept=".txt,text/plain">
    </div>
    <div style="margin: 24px 0;">
      <label for="opponent">Opponent party (Showdown file)</label><br>
      <input type="file" id="opponent" name="opponent" accept=".txt,text/plain">
    </div>
    <div style="margin: 24px 0;">
      <input type="checkbox" id="double" name="double">
      <label for="double">Double battle</label>
    </div>
    <div style="margin: 24px 0;">
      <label for="weather">Weather</label><br>
      <select id="weather" name="weather">
        <option value="0" selected>None</option>
        <option value="1">Rain</option>
        <option value="2">Sun</option>
        <option value="3">Sandstorm</option>
        <option value="4">Hail</option>
      </select>
    </div>
    <div style="margin: 24px 0;">
      <button type="button" id="send">Send</button>
    </div>
    <p id="error" role="alert" style="margin: 24px 0; color: #b00020;"></p>
  </form>
  <script>
    const sendButton = document.getElementById("send");
    const errorBox = document.getElementById("error");

    sendButton.addEventListener("click", async () => {
      errorBox.textContent = "";
      const playerFile = document.getElementById("player").files[0];
      const opponentFile = document.getElementById("opponent").files[0];
      if (!playerFile || !opponentFile) {
        errorBox.textContent = "Please choose both a player and an opponent file.";
        return;
      }
      sendButton.disabled = true;
      try {
        const body = JSON.stringify({
          player: await playerFile.text(),
          opponent: await opponentFile.text(),
          double: document.getElementById("double").checked,
          weather: parseInt(document.getElementById("weather").value, 10),
        });
        const resp = await fetch("/battles", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body,
        });
        const data = await resp.json().catch(() => ({}));
        if (resp.status !== 201) {
          errorBox.textContent = "Battle init failed: " + (data.error || resp.statusText || resp.status);
          return;
        }
        sessionStorage.setItem("battle:" + data.id, JSON.stringify(data));
        window.location.href = "/battle?id=" + encodeURIComponent(data.id);
      } catch (err) {
        errorBox.textContent = "Battle init failed: " + err.message;
      } finally {
        sendButton.disabled = false;
      }
    });
  </script>
</body>
</html>
